name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC: needed by npm Trusted Publishing and by --provenance

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    # Optional: set this to the same environment you configure as the trusted
    # publisher on npmjs.com. Environment secrets would shadow repository ones.
    environment: NPM_KEY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports Trusted Publishing
        run: npm install -g npm@11
      - name: Show what will be published
        run: npm pack --dry-run
      - name: Who is publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY || secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Mode: token (NPM_KEY / NPM_TOKEN secret)"
          else
            echo "Mode: Trusted Publishing (OIDC, no stored token)"
            echo "No npm secret found. This works only after the trusted publisher is configured"
            echo "for this repository/workflow on npmjs.com; otherwise npm returns E403 2FA."
          fi
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY || secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
