name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC: npm Trusted Publishing + --provenance

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    # Must match the Environment name on the npm trusted publisher connection.
    environment: NPM_KEY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports Trusted Publishing
        run: npm install -g npm@11
      - name: Show what will be published
        run: npm pack --dry-run
      - name: Auth mode
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::a token is present in the environment; expected none for OIDC"
          else
            echo "Mode: Trusted Publishing (OIDC, no stored token)"
          fi
      - name: Publish
        run: npm publish --provenance --access public
