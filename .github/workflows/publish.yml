name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    # 环境 secret 只有在 job 声明了同名 environment 时才可用。
    environment: NPM_KEY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the npm token
        env:
          NPM_TOKEN_VALUE: ${{ secrets.NPM_KEY || secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN_VALUE:-}" ]; then
            echo "::error::No npm token found. Add an environment secret named NPM_KEY under Settings -> Environments -> NPM_KEY, or a repository secret named NPM_TOKEN, then re-run this workflow."
            exit 1
          fi
      - name: Show what will be published
        run: npm pack --dry-run
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY || secrets.NPM_TOKEN }}
